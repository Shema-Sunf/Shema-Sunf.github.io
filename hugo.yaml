baseURL: 'https://shema-sunf.github.io'
locale: 'zh-cn'
title: '毒毒糖果铺'
theme: 'neopost'

# 文章链接格式
permalinks:
  posts: "/posts/:contentbasename/"

params:
  # 主题配色（可选: light-blue, dark-blue, light-green, light-yellow, light-pink, light-purple）
  theme: "light-purple"
  
  # 网站图标
  favicon: "/favicon.ico"
  
  # 每页显示文章数（单篇博客模式）
  posts-per-page: 1
  
  # 目录自动编号
  toc-auto-numbering: false
  
  # 侧边栏标签设置
  sidebar:
    tags:
      enable: true
      limit: 5
      more-text: "更多标签..."
  
  # 阅读更多设置
  read-more:
    length-limit: 150
    text:
      more: "展开更多"
      less: "收起内容"

# 菜单（neopost 主题实际上不使用这个，但保留以备后用）
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1

# 输出格式
outputs:
  home:
    - HTML
    - RSS

# 分页
pagination:
  pagerSize: 1

# 启用Git信息（用于自动获取最后更新时间）
enableGitInfo: true

# Frontmatter配置
frontmatter:
  date:
    - date
    - publishDate
    - pubDate
  lastmod:
    - lastmod
    - :git
    - date
    - publishDate
    - pubDate

# 安全设置
security:
  funcs:
    getenv:
      - ^HUGO_
      - ^CI$
