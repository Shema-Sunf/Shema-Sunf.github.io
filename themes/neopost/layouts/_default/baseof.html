<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
    <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <link rel="canonical" href="{{ .Site.BaseURL }}">
    
    {{ with .Site.Params.favicon }}
    <link rel="icon" href="{{ . }}">
    {{ end }}
    
    <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}">
    
    {{ if isset .Params "tags" }}
    <meta name="keywords" content="{{ with .Params.tags }}{{ delimit . ", " }}{{ end }}">
    {{ end }}
    
    {{ partial "style.html" . }}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta charset="utf-8">
</head>
<body>
    <nav id="top-nav">
        <div class="nav-container">
            <a class="nav-title" href="{{ absLangURL "/" }}">{{ .Site.Title }}</a>
            <ul class="nav-menu">
                <li><a href="{{ absLangURL "/" }}">博客</a></li>
                <li><a href="{{ absLangURL "/weekly" }}">周记</a></li>
                <li><a href="{{ absLangURL "/about" }}">关于</a></li>
            </ul>
        </div>
    </nav>
<main>
    {{ block "main" . }}{{ end }}
</main>

<!-- 全局数据输出 -->
<script>
window.blogData = {
    posts: [
        {{ range $i, $p := where .Site.RegularPages "Section" "posts" }}
        {
            title: {{ $p.Title | jsonify | safeJS }},
            url: {{ $p.RelPermalink | jsonify | safeJS }},
            date: "{{ $p.Date.Format "2006-01-02" }}",
            year: {{ $p.Date.Year }},
            month: {{ $p.Date.Month }},
            tags: {{ $p.Params.tags | jsonify | safeJS }}
        }{{ if ne (add $i 1) (len (where $.Site.RegularPages "Section" "posts")) }},{{ end }}
        {{ end }}
    ],
    currentPost: {
        title: {{ .Title | jsonify | safeJS }},
        url: {{ .RelPermalink | jsonify | safeJS }},
        date: "{{ .Date.Format "2006-01-02" }}",
        year: {{ .Date.Year }},
        month: {{ .Date.Month }},
        tags: {{ .Params.tags | jsonify | safeJS }}
    },
    isHomePage: {{ .IsHome }},
    tags: {
        {{ range $i, $tag := .Site.Taxonomies.tags.Alphabetical }}
        {{ $tagName := $tag.Page.Title }}
        {{ $tagName | jsonify | safeJS }}: {
            latestUrl: {{ (index $tag.Pages 0).RelPermalink | jsonify | safeJS }},
            count: {{ $tag.Count }}
        }{{ if ne (add $i 1) (len $.Site.Taxonomies.tags) }},{{ end }}
        {{ end }}
    }
};
</script>
</body>
</html>
