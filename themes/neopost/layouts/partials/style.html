<style>
{{ $themeName := .Site.Params.theme }}
{{ $theme := index (where .Site.Data.themes "name" $themeName) 0 }}
{{ $custom_themes := (index .Site.Data "custom_themes") }}
{{ if $custom_themes }}
    {{ if not $theme }}
        {{ $theme = index (where $custom_themes "name" $themeName) 0 }}
    {{ end }}
{{ end }}

:root {
    --site-bg: url("{{ index $theme "site-bg" }}");
    --accent-color: {{ index $theme "accent-color" }};
    --select-color: {{ index $theme "select-color" }};
    --link-color: {{ index $theme "link-color" }};
    --bg-color: {{ index $theme "bg-color" }};
    --text-color: {{ index $theme "text-color" }};
    --bg-color2: {{ index $theme "bg2-color" }};
    --border-color: {{ index $theme "border-color" }};
    --special-text-color: {{ index $theme "special-text-color" }};
    --post-header-color: {{ index $theme "post-header-color" }};
    --post-shadow-color: {{ index $theme "post-shadow-color" }};
    --outline-color: {{ index $theme "post-outline-color" }};
    --outline-color2: {{ index $theme "post-outline-color2" }};
    --list-style-type: "{{ (index $theme "list-style").type}}";
    --list-style-image: url("{{ (index $theme "list-style").image }}");
}

* {
    box-sizing: border-box;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

@-moz-document url-prefix() {
    * {
        scrollbar-width: thin;
        scrollbar-color: var(--accent-color) #00000000;
    }
}

/* 防止滚动条占用布局宽度 - 使用 gutter 预留空间 */
html {
    scrollbar-gutter: stable;
    overflow-y: auto;
}

::-webkit-scrollbar {
    height: 8px;
    width: 8px;
    background: #00000000;
}

::-webkit-scrollbar-thumb {
    background: var(--accent-color);
    -webkit-border-radius: .3rem;
    -webkit-box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.75);
}

::-webkit-scrollbar-corner {
    background: #000;
}

::selection {
    background: var(--select-color);
    color: var(--bg2-color);
}

body {
    background-color: var(--bg-color);
    background-image: var(--site-bg);
    margin: 0;
    font-size: 14px;
    color: var(--text-color);
}

/* 顶部导航栏样式 */
#top-nav {
    background-color: var(--bg-color2);
    border-bottom: 2px solid var(--border-color);
    padding: 0.5em 0;
    margin: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
}

.nav-container {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 1em;
}

.nav-title {
    font-size: 1.2em;
    font-weight: bold;
    color: var(--special-text-color);
    text-decoration: none;
}

.nav-title:hover {
    color: var(--accent-color);
}

.nav-menu {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 2em;
}

.nav-menu li {
    list-style: none;
}

.nav-menu li a {
    color: var(--text-color);
    text-decoration: none;
    padding: 0.3em 0.8em;
    border-radius: 0.3em;
    transition: all 0.2s ease;
}

.nav-menu li a:hover {
    color: var(--accent-color);
    background-color: var(--select-color);
}

p {line-height: 1.5em;}

div.tags {
    display: block;
    width: 100%;
    text-align: center;
    margin: .5rem 0;
}

div.tags > p.tags {
    text-align: center;
    margin-bottom: 0;
}

div.tags > a {
    margin-top: .5rem;
}

h1 {
    font-size: 1.5em;
    color: var(--post-header-color);
    filter: drop-shadow(2px 0 0 var(--outline-color)) drop-shadow(0 2px 0 var(--outline-color)) drop-shadow(-2px 0 0 var(--outline-color)) drop-shadow(0 -2px 0 var(--outline-color))drop-shadow(0 1px 1px var(--outline-color2)) drop-shadow(1px 0 1px var(--outline-color2));
}

h4,
h5,
h6 {color: var(--special-text-color);}

header {
    background-size: 100%;
    background-position: center;
    min-height: 80px;
    margin: 0 0;
    align-content: center;
}

header > h1 {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    margin: 0 auto;
    font-size: 2em;
/*uncomment this line if you want the header text to not take up the full length of the div*/
    /* width: fit-content; */
    max-width: 48rem;
    padding: 6px 12px;
    border-radius: 1em;
    border: 4px double var(--outline-color);
    filter: none;
    text-align: center;
}

ul.pagination {
    display: flex;
    justify-content: center;
    padding: 0;
}


ul.tags {
    margin: 0;
    padding: 0;
    text-align: center;
    justify-content: center;
}

ul.tags li {
    display: inline-block;
    margin: 0 .2rem;
}

li.page-item {
    list-style: none;
}

li.page-item a{
    display: inline-flex;
    font-size: 1rem;
    margin: .2rem;
    background-color: var(--bg-color2);
    color: var(--text-color);
    padding: 1em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    margin-bottom: 1em;
    box-shadow: var(--post-shadow-color) 5px 5px;

    text-decoration: none;
    user-select: none;
}

li.page-item.active a{
    color: var(--accent-color);
    border-color: var(--accent-color);
}

li.page-item.disabled a{
    cursor: not-allowed;
}

li.page-item:not(.disabled):not(.active) a:hover{
    background-color: var(--select-color);
    color: var(--accent-color);
    border-color: var(--accent-color);
}

li {
    {{ if (index $theme "list-style").image }}
        list-style-image: var(--list-style-image);
    {{ else }}
        list-style-type: var(--list-style-type);
    {{ end }}
}

nav {margin: 1em;}

nav.links > ul {
    max-width: 960px;
    margin: auto;
    line-height: 3rem;
    list-style-type: none;
    padding-left: 0;
    justify-content: space-evenly;
}

nav.links li {
    text-align: center;
    list-style-image: none;
    list-style-type: none;
}

nav.links li > a {
    font-weight: bold;
    background-color: var(--bg-color);
    border: 4px double var(--outline-color);
    padding: .5em 3em;
    text-decoration: none;
}

nav.links li > a:visited {color: var(--link-color);}
nav.links li > a:hover {
    color: var(--accent-color);
    background-color: var(--select-color);
}

nav.languages {
    margin: .3em;
    text-align: center;
}


nav.languages ul {
    display: inline-block;
}

nav.languages ul li {
    display: inline-block;
}

a {
    color: var(--link-color);
    border-radius: .3em;
    transition: .2s ease-out;
}

a:visited {
    color: var(--text-color);
}

a:hover {
    color: var(--accent-color);
    border-color: var(--accent-color);
    transition: .2s ease;
}

#sidebar {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    height: fit-content;
    min-width: 320px;
    margin-top: 1em;
    margin-right: 2em;
    border-radius: .5em;
}

.small-box {
    max-width: 240px;
    margin: auto;
    border: 2px solid var(--bg-color);
    font-size: 11px;
    line-height: 1.5rem;
}

#avatar {
    margin: .5em;
    max-width: 320px;
}

/*flower shape generated from here: https://css-generators.com/flower-shapes/ */
.flower {
    width: 300px; 
    aspect-ratio: 1;
    {{ with .Site.GetPage "section" "/sidebar/_index.md" }}
    {{ if index .Params "icon-use-flower-shape" }}
        --g:/37.02% 37.02% radial-gradient(#000 calc(71% - 1px),#0000 71%) no-repeat;
        mask: 90.078% 79.895% var(--g),33.953% 97.355% var(--g),0.004% 49.372% var(--g),35.148% 2.257% var(--g),90.817% 21.121% var(--g),radial-gradient(100% 100%,#000 25.476%,#0000 calc(25.476% + 1px));
    {{ else }}
        border-radius: 50%;
    {{ end }}
    {{ end }}
}

#bio {
    margin: 20px;
    padding: .2em;
    background: var(--bg-color);
    border: 4px double var(--bg-color2);
    border-radius: 2em;
    font-size: small;
}

#bio p { margin: 1em; }

#content {
    display: flex;
    max-width: 960px;
    margin: auto;
    gap: 2em;
}

.main-content {
    flex: 1;
    min-width: 0;
}

/* 右侧边栏样式 */
#right-sidebar {
    width: 220px;
    flex-shrink: 0;
    margin-top: 1em;
}

.sidebar-box {
    background-color: var(--bg-color2);
    border: 2px solid var(--border-color);
    border-radius: 0.5em;
    margin-bottom: 1em;
    overflow: hidden;
}

.sidebar-title {
    background-color: var(--bg-color);
    color: var(--special-text-color);
    margin: 0;
    padding: 0.6em 1em;
    font-size: 0.95em;
    border-bottom: 2px solid var(--border-color);
    text-align: left;
}

.sidebar-content {
    padding: 0.8em;
}

/* 最近文章列表样式 */
.recent-post-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 0.8em;
    font-size: 0.85em;
    line-height: 1.4;
    padding-bottom: 0.5em;
    border-bottom: 1px dotted var(--border-color);
}

.recent-post-item:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.recent-post-date {
    background-color: var(--bg-color);
    color: var(--special-text-color);
    font-size: 0.75em;
    padding: 0.15em 0.4em;
    border-radius: 0.2em;
    margin-right: 0.6em;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 0.15em;
}

.recent-post-item a {
    color: var(--link-color);
    text-decoration: none;
    word-break: break-word;
    line-height: 1.5;
    transition: all 0.2s ease;
}

.recent-post-item a:hover {
    color: var(--accent-color);
}

/* 侧边栏标签样式 */
ul.sidebar-tags {
    margin: 0;
    padding: 0;
    list-style: none;
}

.sidebar-tags li {
    margin-bottom: 0.5em;
    list-style: none;
    display: flex;
    align-items: center;
}

.sidebar-tags li::before {
    content: "▸";
    color: var(--accent-color);
    margin-right: 0.4em;
    font-size: 0.8em;
}

.sidebar-tags li a {
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: var(--link-color);
    text-decoration: none;
    font-size: 0.85em;
    padding: 0.2em 0;
    transition: all 0.2s ease;
}

.sidebar-tags li a:hover {
    color: var(--accent-color);
    transform: translateX(3px);
}

.sidebar-tags li a .tag-count {
    color: var(--special-text-color);
    font-size: 0.85em;
    opacity: 0.7;
}

/* 当前选中的tag高亮样式 */
.sidebar-tags li a.current-tag {
    /*color: var(--accent-color);
    border-radius: 0.3em;
    margin: 0em -0.5em;
    background-color: var(--select-color);
    padding: 0.2em 0.5em;*/
    font-weight: bold;
}

/* 当前阅读的文章高亮样式 */
.recent-post-item.current-post {
    /*background-color: var(--select-color);
    margin: -0.3em -0.5em;
    padding: 0.3em 0.5em;
    border-radius: 0.3em;*/
    font-weight: bold;
}

.recent-post-item.current-post .recent-post-date {
    background-color: var(--accent-color);
    color: var(--bg-color2);
    font-weight: normal;
}

.recent-post-item a.current-post-link {
    color: var(--accent-color);
    font-weight: bold;
}

/* New!! 标记样式 */
.new-badge {
    background-color: var(--accent-color);
    color: var(--bg-color2);
    font-size: 0.7em;
    padding: 0.1em 0.4em;
    border-radius: 0.3em;
    margin-left: 0em;
    font-weight: normal;
}

.sidebar-tags li.new-tag a {
    color: var(--accent-color);
}

.more-tags {
    text-align: center;
    margin-top: 0.8em;
    padding-top: 0.5em;
    border-top: 1px dashed var(--border-color);
}

.more-tags a {
    font-size: 0.85em;
    color: var(--special-text-color);
    text-decoration: none;
    padding: 0.3em 0.8em;
    border-radius: 0.3em;
    transition: all 0.2s ease;
}

.more-tags a:hover {
    background-color: var(--select-color);
    color: var(--accent-color);
}

/* Tag列表页面样式 */
.tag-post-list {
    margin-top: 1.5em;
}

.tag-post-item {
    padding: 1em 0;
    border-bottom: 1px dashed var(--border-color);
}

.tag-post-item:last-child {
    border-bottom: none;
}

.tag-post-date {
    color: var(--special-text-color);
    font-size: 0.85em;
    margin-bottom: 0.3em;
}

.tag-post-item > a {
    font-size: 1.1em;
    font-weight: bold;
    color: var(--link-color);
    text-decoration: none;
}

.tag-post-item > a:hover {
    color: var(--accent-color);
    text-decoration: underline;
}

.tag-post-item > p {
    margin: 0.5em 0 0 0;
    font-size: 0.9em;
    color: var(--text-color);
    line-height: 1.5;
}

/* 标签云页面样式 */
.tags-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8em;
    margin-top: 1.5em;
}

.tags-cloud .tag-item {
    display: inline-block;
}

.tags-cloud .tag-item a {
    display: inline-block;
    padding: 0.5em 1em;
    background-color: var(--bg-color);
    border: 2px solid var(--border-color);
    border-radius: 0.3em;
    color: var(--link-color);
    text-decoration: none;
    transition: all 0.2s ease;
}

.tags-cloud .tag-item a:hover {
    background-color: var(--select-color);
    color: var(--accent-color);
    border-color: var(--accent-color);
}

.tags-cloud .tag-count {
    color: var(--special-text-color);
    font-size: 0.9em;
    opacity: 0.8;
}

/* 404页面样式 */
.not-found-page {
    text-align: center;
}

.not-found-page h2 {
    color: var(--special-text-color);
    font-size: 2em;
    margin-bottom: 1em;
}

.not-found-content {
    padding: 1em;
}

.not-found-content p {
    font-size: 1.1em;
    margin-bottom: 0.8em;
}

.not-found-content ul {
    display: inline-block;
    text-align: left;
    margin: 1em 0;
    padding-left: 1.5em;
}

.not-found-content li {
    margin-bottom: 0.5em;
}

.not-found-actions {
    margin-top: 2em;
    display: flex;
    justify-content: center;
    gap: 1.5em;
}

.not-found-actions a {
    display: inline-block;
    padding: 0.6em 1.2em;
    background-color: var(--bg-color);
    border: 2px solid var(--border-color);
    border-radius: 0.3em;
    color: var(--link-color);
    text-decoration: none;
    font-weight: bold;
    transition: all 0.2s ease;
}

.not-found-actions a:hover {
    background-color: var(--select-color);
    color: var(--accent-color);
    border-color: var(--accent-color);
}

/* 动态侧边栏样式 */
.sidebar-header {
    /*display: flex;*/
    justify-content: space-between;
    align-items: center;
    padding: 0.6em 1em;
    background-color: var(--bg-color);
    border-bottom: 2px solid var(--border-color);
}

.sidebar-header .sidebar-title {
    margin: 0;
    padding: 0;
    border: none;
    background: none;
    text-align: left;
}

.month-selector select {
    padding: 0.2em 0.5em;
    border: 1px solid var(--border-color);
    border-radius: 0.3em;
    background-color: var(--bg-color2);
    color: var(--text-color);
    font-size: 0.85em;
    cursor: pointer;
}

.month-selector select:hover {
    border-color: var(--accent-color);
}

.expand-toggle {
    text-align: center;
    padding: 0.5em;
    border-top: 1px dashed var(--border-color);
}

.expand-toggle a {
    color: var(--special-text-color);
    text-decoration: none;
    font-size: 0.85em;
}

.expand-toggle a:hover {
    color: var(--accent-color);
    text-decoration: underline;
}

.no-posts {
    text-align: center;
    color: var(--special-text-color);
    padding: 1em;
    font-size: 0.9em;
    opacity: 0.7;
}

/* 底部导航样式 */
.post-navigation {
    margin-top: 1.5em;
    padding: 1em;
    background-color: var(--bg-color2);
    border: 2px solid var(--border-color);
    border-radius: 0.3em;
}

.nav-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9em;
}

.nav-links a {
    color: var(--link-color);
    text-decoration: none;
    padding: 0.3em 0.8em;
    border-radius: 0.3em;
    transition: all 0.2s ease;
}

.nav-links a:hover {
    color: var(--accent-color);
    background-color: var(--select-color);
}

.nav-prev, .nav-next {
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nav-top {
    color: var(--special-text-color);
    font-weight: bold;
}

.nav-links .disabled {
    color: var(--border-color);
    padding: 0.3em 0.8em;
    cursor: not-allowed;
}

/* 最后更新时间样式 */
.last-updated {
    color: var(--special-text-color);
    font-size: 0.85em;
    font-weight: normal;
    opacity: 0.8;
    float: right
}

main {
    padding: 1em;
    padding-top: 0;
}

#top {
    background-color: var(--bg-color);
}

#top section {
    background-color: var(--bg-color2);
    border-radius: .5em;
    margin-bottom: 10px;
    padding: .5em 1em;
    width: 100%;
}

article {
    background-color: var(--bg-color2);
    padding: 1em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    margin-bottom: 1em;
    margin-top: 1em;
    box-shadow: var(--post-shadow-color) 5px 5px;
}
article img {
    max-width: 100%;
}

.readmore summary {
    font-weight: bold;
    color: var(--special-text-color);
    list-style: none;
    cursor: pointer;
}

header h1 a {
    cursor: pointer;
    text-decoration: none;
    color: var(--special-text-color);
}

header h1 a:visited {
    color: inherit;
}

header h1 a:hover {
    color: inherit;
}

.readmore div {
    display: inline;
}

.readmore div p {
    display: block;
}

.read-more-btn {
    display: inline;
    cursor: pointer;
    margin-left: 4px;
    color: var(--link-color);
    text-decoration: underline;
}

.readmore summary::-webkit-details-marker {
  display: none;
}

.readmore[open] > summary {
    border-bottom: 2px dashed var(--bg-color);
    padding-bottom: .6em;
    margin-bottom: .6em;
}

.post-header {
    color: var(--special-text-color);
    font-weight: bold;
    padding: .5rem 0;
    border-bottom: 4px double var(--outline-color);
}

.timestamp {
    font-weight: normal;
    font-size: smaller;
    margin: .2em;
    float: right;
}

.tag-item p {
    font-size: smaller;
}

.photosetx2,
.photosetx3 {
    display: grid;
    gap: 4px;
    align-items: center;
}

.photosetx2 {grid-template-columns: 1fr 1fr;}
.photosetx3 {grid-template-columns: 1fr 1fr 1fr;}

.cropped {
    width: 156px;
    height: 156px;
    overflow: hidden;
    object-position: 25% 25%;
}
.photosetx2 img,
.photosetx3 img {object-fit: cover;}

.center { text-align: center; }

.img-right {
    max-width: 7.5em;
    max-height: 7.5em;
    float: right;
}

.clearfix::after {
  content: "";
  clear: both;
  display: table;
}

.small-text {
    font-size: 11px;
    text-shadow: var(--bg-color) 1px 1px;
}

.dropbox-btn {
    color: var(--link-color);
    font-weight: bold;
    background-color: var(--bg-color);
    /* border: 4px double var(--outline-color); */
    border: 1px solid var(--outline-color);
    /* padding: .5em 3em; */
    text-decoration: none;
    border-radius: 0.2em;
}

.dropbox-content[visible] {
    display: block;
}

.dropbox-content {
    display: none;
    position: absolute;
    z-index: 1
}

.table-of-contents {
    background-color: var(--bg-color2);
    padding: .3em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    box-shadow: var(--post-shadow-color) 5px 5px;
}

.table-of-contents.sidebar {
    position: sticky;
    top: 1rem;
    height: fit-content;
    width: 10rem;
    flex-shrink: 0;
    max-height: calc(100vh - 2rem);
    overflow-x: auto;
    scrollbar-gutter: stable;
}

.table-of-contents.float {
    width: max-content;
    max-width: 50vw;
    max-height: 50%;
    overflow: auto;
}

.table-of-contents nav {
    margin: 0 .5em;
}

.table-of-contents nav ul {
    margin: .5em 1em;
    padding: 0;
}

.table-of-contents nav li {
    margin: .3em 0;
}

#single-post {
